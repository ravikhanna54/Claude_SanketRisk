name: Restore test
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      RESTORE_DB_URL: postgresql://postgres:test@localhost:5432/postgres
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Get the newest backup from GitHub
        run: |
          RUN=$(gh run list --workflow nightly-backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Using backup from run $RUN"
          mkdir -p dl && gh run download "$RUN" --pattern 'sanket-*-backup' --dir dl
          find dl -name '*.gpg'
      - name: Restore into a scratch database and check
        run: bash backup/restore-test.sh "$(find dl -name '*.gpg' | head -1)"
