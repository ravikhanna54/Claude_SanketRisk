[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://maps.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; connect-src 'self' https://lzsfmqbhrpsmnivxhggi.supabase.co wss://lzsfmqbhrpsmnivxhggi.supabase.co https://*.lambda-url.ap-southeast-2.on.aws https://api.anthropic.com https://maps.googleapis.com https://places.googleapis.com https://evaluebc.bcassessment.ca https://evs.e2value.ca https://overpass-api.de https://nominatim.openstreetmap.org https://hdsc.nws.noaa.gov https://hazards.fema.gov https://earthquake.usgs.gov https://api.opencorporates.com https://minedbuildings.z5.web.core.windows.net https://api.voyageai.com https://vision.googleapis.com; frame-src 'self' blob: data: https://*.supabase.co https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /.netlify/functions/csp-report"
