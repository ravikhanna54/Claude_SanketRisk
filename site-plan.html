<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SanketRisk ONE — Site Plan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy:#1b2a4a; --gold:#c9a84c; --text:#1a202c; --light:#718096; --bg:#eef1f6; --line:#d5dbe6; }
  html, body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .bar { background:var(--navy); color:#fff; height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
  .bar .t { font-size:14px; font-weight:600; } .bar .t span { color:var(--gold); }
  .bar a { color:#b8c2d8; font-size:12px; text-decoration:none; }
  .wrap { max-width:1000px; margin:0 auto; padding:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  input[type=text], input[type=number], input[type=date], select { height:40px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:14px; background:#fff; }
  #addr { flex:1; min-width:200px; }
  button { height:40px; min-width:40px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; font-weight:600; color:var(--navy); cursor:pointer; }
  button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  button.pri { background:var(--gold); border-color:var(--gold); color:#1b2a4a; }
  button.danger { color:#c53030; }
  button:disabled { opacity:.4; cursor:default; }
  .sep { width:1px; height:28px; background:var(--line); margin:0 2px; }
  .stage { position:relative; background:#cfd6e3; border:1px solid var(--line); border-radius:8px; overflow:hidden; line-height:0; }
  canvas#cv { width:100%; height:auto; touch-action:none; display:block; }
  .hint { font-size:12.5px; color:var(--light); margin:8px 2px; line-height:1.5; min-height:19px; }
  .status { font-size:12.5px; color:var(--navy); font-weight:600; }
  .symbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .symbar button { height:62px; width:74px; padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:9.5px; font-weight:600; line-height:1.1; }
  .symbar canvas { width:40px; height:40px; }
  .lbl { font-size:12px; color:var(--light); font-weight:600; }
  dialog { border:none; border-radius:12px; padding:18px; width:min(440px,92vw); box-shadow:0 10px 40px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h3 { font-size:15px; color:var(--navy); margin-bottom:12px; }
  dialog label { display:block; font-size:12px; color:var(--light); font-weight:600; margin:8px 0 3px; }
  dialog input { width:100%; }
  dialog .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<div class="bar"><div class="t"><span>S</span> SanketRisk ONE — Site Plan</div><a href="/dashboard.html">← Dashboard</a></div>
<div class="wrap">
  <div class="row">
    <input type="text" id="addr" placeholder="Property address, or lat,lng">
    <button class="pri" id="btn-load">Load map</button>
    <button id="btn-blank" title="Draw on a plain grid when there is no map for the location">⬜ Blank plan</button>
    <select id="mtype">
      <option value="satellite">Satellite (clean)</option>
      <option value="hybrid">Satellite + street names</option>
      <option value="roadmap-off">Street map (no labels)</option>
      <option value="roadmap">Street map</option>
    </select>
    <button id="zout" title="Zoom out">−</button><button id="zin" title="Zoom in">+</button>
    <span class="status" id="status">No map loaded</span>
  </div>
  <div class="row" id="tools">
    <button data-tool="select" class="on">Select</button>
    <button data-tool="pan">✋ Move map</button>
    <button data-tool="dist">📏 Distance</button>
    <button data-tool="poly">⬠ Building</button>
    <button data-tool="line">╱ Line</button>
    <button data-tool="arrow">➜ Arrow</button>
    <button data-tool="text">T Text</button>
    <span class="sep"></span>
    <button id="btn-info">🗒 Info box</button>
    <button id="btn-legend">Legend</button>
    <span class="sep"></span>
    <button data-tool="calib" title="Draw over a known length to set the scale">Calibrate</button>
    <button id="btn-attach" class="pri" style="display:none">Attach to report</button>
    <button id="btn-save">Save image</button>
  </div>
  <div class="row">
    <span class="lbl">Text</span>
    <select id="fontsel">
      <option value="Arial">Arial</option><option value="Verdana">Verdana</option><option value="Trebuchet MS">Trebuchet</option>
      <option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option>
      <option value="Courier New">Courier New</option><option value="Impact">Impact</option>
    </select>
    <input type="number" id="sizein" value="30" min="14" max="90" step="2" style="width:74px" title="Text size">
    <button id="btn-bold" style="font-weight:800">B</button>
    <input type="color" id="color" value="#ff2d2d" style="height:40px;width:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px" title="Colour">
    <span class="sep"></span>
    <button id="btn-finish" style="display:none">Finish building</button>
    <button id="btn-edit" disabled>Edit label</button>
    <button id="btn-del" class="danger" disabled>Delete</button>
    <button id="btn-undo">Undo</button>
    <button id="btn-clear" class="danger">Clear all</button>
  </div>
  <div class="symbar" id="symbar"></div>
  <div class="stage" id="stage"><canvas id="cv" width="1280" height="1280"></canvas></div>
  <div class="hint" id="hint">Enter the property address and tap Load map, or choose Blank plan to draw on a plain grid.</div>
</div>

<dialog id="infoDlg">
  <h3>Plan information box</h3>
  <label>Title</label><input type="text" id="f-title" maxlength="60">
  <label>Insured</label><input type="text" id="f-insured" maxlength="100">
  <label>Property address</label><input type="text" id="f-address" maxlength="140">
  <label>Date</label><input type="date" id="f-date">
  <label>Prepared by</label><input type="text" id="f-by" maxlength="80">
  <label>Reference / file no.</label><input type="text" id="f-ref" maxlength="60">
  <div class="btns"><button id="info-cancel">Cancel</button><button class="pri" id="info-ok">Place on plan</button></div>
</dialog>

<script>
  const SUPABASE_URL = 'https://lzsfmqbhrpsmnivxhggi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_C5KWTHt84OMXif4javqeOQ_rjFK0t83';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { autoRefreshToken: true, persistSession: true } });

  const N = 1280;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let token = null, img = null, imgOff = { x: 0, y: 0 }, loadSeq = 0;
  let view = { lat: 0, lng: 0, zoom: 19, k: 1, calibrated: false, ok: false, address: '' };
  let items = [], sel = -1, tool = 'select', pend = null, polyPts = [], drag = null, undoStack = [];
  let off = { x: 0, y: 0 }, panDrag = null, symKey = 'hyd', legendDismissed = false, bold = false;
  const prefill = {};

  const HINTS = {
    select: 'Tap an item to select it, then drag it, or drag its round handles. Drag the empty map to move the map.',
    pan: 'Drag the map in any direction to centre it.',
    dist: 'Tap the start point, then the end point. The distance is measured from the map scale and labelled automatically.',
    poly: 'Tap each corner of the building, then tap “Finish building”.',
    line: 'Tap the start, then the end.',
    arrow: 'Tap the start, then the arrow tip.',
    text: 'Tap where the text should go. Choose the font, size and colour first (or select the text and change them).',
    sym: 'Tap on the map to place the chosen symbol. Pick another symbol below to change it.',
    calib: 'Draw a line over something of known length (for example a measured wall) and enter its length.'
  };

  // ---------- scale ----------
  function mpp() { if (view.blank) return view.bm / Math.pow(2, view.zoom - 19) * view.k; return 156543.03392 * Math.cos(view.lat * Math.PI / 180) / Math.pow(2, view.zoom) / 2 * view.k; }
  function distM(a, b) { return Math.hypot(a.x - b.x, a.y - b.y) * mpp(); }
  function fmt(m) { return (m < 10 ? m.toFixed(1) : Math.round(m)) + ' m (' + Math.round(m * 3.28084) + ' ft)'; }

  // ---------- loading ----------
  function setStatus(t) { $('status').textContent = t; }
  function authedFetch(url) { return fetch(url, { headers: { Authorization: 'Bearer ' + token } }); }
  async function geocode(text) {
    const m = text.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
    if (m) return { lat: +m[1], lng: +m[3], address: text.trim() };
    const r = await authedFetch('/.netlify/functions/maps-proxy?geocode=' + encodeURIComponent(text));
    if (!r.ok) throw new Error('Address lookup failed (' + r.status + '). You can type coordinates as lat,lng instead.');
    return r.json();
  }
  async function loadMap() {
    if (!view.ok) return;
    if (view.blank) { img = null; imgOff = { x: 0, y: 0 }; refreshStatus(); draw(); return; }
    const seq = ++loadSeq; setStatus('Loading map…');
    const mt = $('mtype').value, labelsOff = mt === 'roadmap-off';
    const url = '/.netlify/functions/maps-proxy?center=' + encodeURIComponent(view.lat.toFixed(7) + ',' + view.lng.toFixed(7)) +
      '&zoom=' + view.zoom + '&size=640x640&scale=2&maptype=' + (labelsOff ? 'roadmap' : mt) + (labelsOff ? '&labels=off' : '');
    const r = await authedFetch(url);
    if (seq !== loadSeq) return;
    if (!r.ok) { setStatus('Map failed (' + r.status + ')'); return; }
    const blob = await r.blob();
    const im = new Image();
    await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = URL.createObjectURL(blob); });
    if (seq !== loadSeq) return;
    img = im; imgOff = { x: 0, y: 0 };
    refreshStatus(); draw();
  }
  function refreshStatus() { if (view.blank) { setStatus('Blank plan · ' + (view.calibrated ? 'calibrated' : 'set') + ' scale: 100 px ≈ ' + (mpp() * 100).toFixed(1) + ' m'); return; } setStatus('Zoom ' + view.zoom + ' · ' + (view.calibrated ? 'calibrated' : 'auto') + ' scale: 100 px ≈ ' + (mpp() * 100).toFixed(1) + ' m'); }
  function todayStr() { return new Date().toLocaleDateString('en-CA'); }

  $('btn-load').onclick = async () => {
    const t = $('addr').value.trim(); if (!t) return;
    try {
      setStatus('Finding address…');
      const g = await geocode(t);
      view.blank = false; view.gx = 0; view.gy = 0; view.lat = g.lat; view.lng = g.lng; view.zoom = 19; view.k = 1; view.calibrated = false; view.ok = true; view.address = g.address || t;
      items = []; sel = -1; undoStack = []; legendDismissed = false; off = { x: 0, y: 0 };
      await loadMap();
      if (prefill.insured || prefill.by || prefill.ref) placeInfo({ title: 'Site Plan', insured: prefill.insured || '', address: prefill.address || view.address, date: prefill.date || todayStr(), by: prefill.by || '', ref: prefill.ref || '' });
      $('hint').textContent = HINTS[tool];
    } catch (e) { setStatus('Could not load'); $('hint').textContent = e.message; }
  };
  $('addr').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-load').click(); });
  $('mtype').onchange = () => { if (view.blank) { $('hint').textContent = 'This is a blank plan. Enter an address and tap Load map to use a map instead.'; return; } loadMap(); };

  $('btn-blank').onclick = () => {
    const v = prompt('Blank plan: how wide is the area you will draw, in metres? (for example 120)', '100');
    if (v === null) return;
    const w = parseFloat(v); if (!(w >= 5 && w <= 5000)) { alert('Please enter a width between 5 and 5000 metres.'); return; }
    view = { lat: 0, lng: 0, zoom: 19, k: 1, calibrated: false, ok: true, address: $('addr').value.trim(), blank: true, bm: w / N, gx: 0, gy: 0 };
    items = []; sel = -1; undoStack = []; legendDismissed = false; off = { x: 0, y: 0 }; img = null; imgOff = { x: 0, y: 0 };
    refreshStatus(); draw();
    if (prefill.insured || prefill.by || prefill.ref) placeInfo({ title: 'Site Plan', insured: prefill.insured || '', address: prefill.address || view.address, date: prefill.date || todayStr(), by: prefill.by || '', ref: prefill.ref || '' });
    $('hint').textContent = 'Blank plan ready. Draw buildings with the Building tool and measure with Distance. Use Calibrate if you know a real length.';
  };

  // map-anchored items move/scale with the map; info + legend stay fixed on the page
  const isPage = it => it.t === 'info' || it.t === 'legend';
  function shiftPt(it, f) { if (it.pts) it.pts = it.pts.map(f); if (it.p) it.p = f(it.p); }
  function anchored(f) { items.forEach(it => { if (!isPage(it)) shiftPt(it, f); }); }
  let zoomTimer = null;
  function zoomBy(d) {
    if (!view.ok) return;
    const nz = Math.max(15, Math.min(21, view.zoom + d)); if (nz === view.zoom) return;
    const f = Math.pow(2, nz - view.zoom);
    anchored(p => ({ x: N / 2 + (p.x - N / 2) * f, y: N / 2 + (p.y - N / 2) * f }));
    if (view.blank) { view.gx = (view.gx || 0) * f; view.gy = (view.gy || 0) * f; }
    view.zoom = nz; refreshStatus(); loadMap();
  }
  $('zin').onclick = () => zoomBy(1); $('zout').onclick = () => zoomBy(-1);
  cv.addEventListener('wheel', e => { e.preventDefault(); clearTimeout(zoomTimer); const d = e.deltaY < 0 ? 1 : -1; zoomTimer = setTimeout(() => zoomBy(d), 120); }, { passive: false });

  function finishPan() {
    const dx = off.x, dy = off.y; panDrag = null;
    if (!view.ok || (Math.abs(dx) < 2 && Math.abs(dy) < 2)) { off = { x: 0, y: 0 }; draw(); return; }
    if (view.blank) { view.gx = (view.gx || 0) + dx; view.gy = (view.gy || 0) + dy; anchored(p => ({ x: p.x + dx, y: p.y + dy })); off = { x: 0, y: 0 }; draw(); return; }
    const m = mpp();
    view.lat += dy * m / 111320;
    view.lng -= dx * m / (111320 * Math.cos(view.lat * Math.PI / 180));
    anchored(p => ({ x: p.x + dx, y: p.y + dy }));
    imgOff = { x: dx, y: dy }; off = { x: 0, y: 0 };
    draw(); loadMap();
  }

  // ---------- items ----------
  function snapshot() { undoStack.push(JSON.stringify(items)); if (undoStack.length > 60) undoStack.shift(); }
  function add(it) { snapshot(); items.push(it); sel = items.length - 1; updateButtons(); draw(); }
  function updateButtons() {
    const it = items[sel];
    $('btn-del').disabled = !it;
    $('btn-edit').disabled = !(it && (it.t === 'dist' || it.t === 'text' || it.t === 'info'));
    $('btn-finish').style.display = (tool === 'poly' && polyPts.length >= 3) ? '' : 'none';
  }
  function labelOf(it) { return it.label != null ? it.label : fmt(distM(it.pts[0], it.pts[1])); }
  function curStyle() { return { font: $('fontsel').value, size: parseInt($('sizein').value, 10) || 30, bold: bold }; }
  function fontStr(it, size, forceBold) { return ((forceBold || it.bold) ? '700 ' : '400 ') + (size || it.size || 30) + 'px "' + (it.font || 'Arial') + '", Arial, sans-serif'; }

  // ---------- pictorial symbols ----------
  const SYMS = {
    hyd: { name: 'Hydrant', color: '#d32f2f' }, sr: { name: 'Sprinkler riser', color: '#1565c0' },
    fdc: { name: 'FD connection', color: '#e65100' }, piv: { name: 'PIV valve', color: '#2e7d32' },
    ent: { name: 'Entrance', color: '#00695c' }, ext: { name: 'Extinguisher', color: '#c62828' },
    alm: { name: 'Alarm panel', color: '#6a1b9a' }, gas: { name: 'Gas shut-off', color: '#ef6c00' },
    wat: { name: 'Water shut-off', color: '#0277bd' }, elc: { name: 'Electrical shut-off', color: '#b78700' },
    north: { name: 'North arrow', color: '#111111' }
  };
  function glyph(c, k, col) {            // drawn in a -1..1 box
    c.fillStyle = col; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
    const R = (x, y, w, h) => c.fillRect(x, y, w, h);
    if (k === 'hyd') {
      c.beginPath(); c.arc(0, -0.42, 0.42, Math.PI, 0); c.fill();
      R(-0.38, -0.42, 0.76, 0.98); R(-0.72, -0.12, 0.34, 0.34); R(0.38, -0.12, 0.34, 0.34);
      R(-0.12, -0.98, 0.24, 0.22); R(-0.56, 0.56, 1.12, 0.28);
    } else if (k === 'sr') {
      R(-0.65, -0.92, 1.3, 0.2); R(-0.1, -0.72, 0.2, 1.0);
      c.beginPath(); c.arc(0, 0.38, 0.17, 0, 7); c.fill(); R(-0.42, 0.52, 0.84, 0.12);
      c.lineWidth = 0.13; [-0.5, 0, 0.5].forEach(x => { c.beginPath(); c.moveTo(x * 0.5, 0.72); c.lineTo(x, 0.96); c.stroke(); });
    } else if (k === 'fdc') {
      c.beginPath(); c.arc(-0.42, -0.4, 0.32, 0, 7); c.fill(); c.beginPath(); c.arc(0.42, -0.4, 0.32, 0, 7); c.fill();
      c.lineWidth = 0.2; c.beginPath(); c.moveTo(-0.42, -0.1); c.lineTo(0, 0.4); c.lineTo(0.42, -0.1); c.moveTo(0, 0.4); c.lineTo(0, 0.95); c.stroke();
    } else if (k === 'piv') {
      c.beginPath(); c.arc(0, -0.4, 0.5, 0, 7); c.fill(); R(-0.16, -0.1, 0.32, 1.0); R(-0.5, 0.78, 1.0, 0.16);
      c.fillStyle = '#fff'; R(-0.34, -0.47, 0.68, 0.14);
    } else if (k === 'ent') {
      c.lineWidth = 0.16; c.strokeRect(-0.05, -0.85, 0.8, 1.7); c.fillRect(-0.05, -0.85, 0.8, 1.7);
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0.5, 0.05, 0.07, 0, 7); c.fill();
      c.strokeStyle = col; c.lineWidth = 0.18; c.beginPath(); c.moveTo(-0.95, 0); c.lineTo(-0.25, 0); c.stroke();
      c.beginPath(); c.moveTo(-0.15, 0); c.lineTo(-0.5, -0.3); c.lineTo(-0.5, 0.3); c.closePath(); c.fill();
    } else if (k === 'ext') {
      c.beginPath(); c.roundRect ? c.roundRect(-0.32, -0.25, 0.64, 1.1, 0.2) : c.rect(-0.32, -0.25, 0.64, 1.1); c.fill();
      R(-0.12, -0.55, 0.24, 0.32); R(-0.12, -0.72, 0.52, 0.16);
      c.lineWidth = 0.1; c.beginPath(); c.moveTo(0.4, -0.64); c.quadraticCurveTo(0.7, -0.2, 0.52, 0.2); c.stroke();
    } else if (k === 'alm') {
      c.beginPath(); c.arc(0, -0.1, 0.55, Math.PI, 0); c.lineTo(0.75, 0.48); c.lineTo(-0.75, 0.48); c.closePath(); c.fill();
      c.beginPath(); c.arc(0, 0.7, 0.16, 0, 7); c.fill(); R(-0.07, -0.85, 0.14, 0.2);
    } else if (k === 'gas') {
      c.beginPath(); c.moveTo(0, -0.95); c.bezierCurveTo(0.2, -0.4, 0.8, -0.1, 0.7, 0.35); c.bezierCurveTo(0.6, 0.8, 0.2, 0.92, 0, 0.92);
      c.bezierCurveTo(-0.5, 0.92, -0.8, 0.5, -0.6, 0); c.bezierCurveTo(-0.5, 0.2, -0.3, 0.25, -0.2, 0.1); c.bezierCurveTo(-0.3, -0.4, -0.1, -0.7, 0, -0.95); c.fill();
    } else if (k === 'wat') {
      c.beginPath(); c.moveTo(0, -0.95); c.bezierCurveTo(0.8, 0, 0.72, 0.88, 0, 0.88); c.bezierCurveTo(-0.72, 0.88, -0.8, 0, 0, -0.95); c.fill();
    } else if (k === 'elc') {
      c.beginPath(); c.moveTo(0.25, -0.95); c.lineTo(-0.55, 0.15); c.lineTo(-0.08, 0.15); c.lineTo(-0.28, 0.95); c.lineTo(0.55, -0.22); c.lineTo(0.08, -0.22); c.closePath(); c.fill();
    }
  }
  function drawSym(c, k, x, y, r) {      // round white badge with a coloured ring and the icon inside
    const s = SYMS[k];
    c.save(); c.translate(x, y);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.lineWidth = Math.max(2, r * 0.14); c.strokeStyle = s.color; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
    if (k === 'north') {
      c.fillStyle = '#111'; c.beginPath(); c.moveTo(0, -r * 0.8); c.lineTo(r * 0.36, r * 0.3); c.lineTo(0, r * 0.1); c.lineTo(-r * 0.36, r * 0.3); c.closePath(); c.fill();
      c.font = '800 ' + Math.round(r * 0.5) + 'px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('N', 0, r * 0.58);
    } else { const u = r * 0.62; c.scale(u, u); glyph(c, k, s.color); }
    c.restore();
  }
  (function buildPalette() {
    const bar = $('symbar');
    Object.keys(SYMS).forEach(k => {
      const b = document.createElement('button'); b.dataset.sym = k;
      const cvs = document.createElement('canvas'); cvs.width = 80; cvs.height = 80;
      drawSym(cvs.getContext('2d'), k, 40, 40, 36);
      const sp = document.createElement('span'); sp.textContent = SYMS[k].name;
      b.appendChild(cvs); b.appendChild(sp);
      b.onclick = () => { symKey = k; setTool('sym'); };
      bar.appendChild(b);
    });
  })();
  function markPalette() { document.querySelectorAll('#symbar button').forEach(b => b.classList.toggle('on', tool === 'sym' && b.dataset.sym === symKey)); }

  // ---------- drawing ----------
  function halo(text, x, y, font, color) {
    ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const size = parseInt(font.match(/(\d+)px/)[1], 10);
    ctx.lineWidth = size / 4; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y);

    ['insured', 'address', 'date', 'by', 'ref'].forEach(k => { const v = q.get(k); if (v) prefill[k] = v.slice(0, 140); });
    const pre = q.get('addr') || prefill.address;
    markPalette(); draw();
    if (hasInsp && await restoreSaved()) { $('hint').textContent = 'Opened the plan you saved earlier. Change it and tap “Attach to report” to update the report.'; return; }
    if (pre) { $('addr').value = pre.slice(0, 200); $('btn-load').click(); }
  })();
</script>
