name: Nightly backup
on:
  schedule:
    - cron: "20 19 * * *"      # 19:20 UTC = 02:20 Thailand time, every night
  workflow_dispatch: {}          # lets you press "Run workflow" for a test
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up database
        run: |
          STAMP=$(date -u +%F)
          python backup/backup.py raw.tar.gz
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -c --cipher-algo AES256 -o "sanket-commercial-$STAMP.tar.gz.gpg" raw.tar.gz
          rm -rf raw.tar.gz work
          ls -l sanket-commercial-*.gpg
      - name: Export every table as CSV (encrypted)
        run: |
          STAMP=$(date -u +%F)
          python backup/csvexport.py csv-export.zip
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -c --cipher-algo AES256 -o "sanket-commercial-$STAMP-csv.zip.gpg" csv-export.zip
          rm -rf csv-export.zip csv_work
          ls -l sanket-commercial-*-csv.zip.gpg
      - name: Keep a 30-day copy in GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sanket-commercial-backup
          path: sanket-commercial-*.gpg
          retention-days: 30
      - name: Prepare Google Drive sign-in
        if: env.GDRIVE_CLIENT_ID != ''
        run: |
          mkdir -p state
          git fetch origin backup-state && git show origin/backup-state:gdrive.gpg > state/gdrive.gpg
      - name: Copy database backup to Google Drive
        if: env.GDRIVE_CLIENT_ID != ''
        run: for f in sanket-commercial-*.gpg; do python backup/gdrive.py upload "$f"; done
      - name: Copy new stored files (photos, PDFs) to Google Drive
        if: env.GDRIVE_CLIENT_ID != ''
        run: python -u backup/gdrive.py mirror
